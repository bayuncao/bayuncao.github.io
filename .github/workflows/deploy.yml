name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  # 当推送到 main 分支时触发
  workflow_dispatch:    # 允许手动触发

# Add permissions to allow the workflow to push to GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install pnpm 📦
        uses: pnpm/action-setup@v4
        with:
          version: 8 # Specify pnpm version

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'pnpm'
          # 增加缓存 key，使用 pnpm-lock.yaml 的哈希值生成唯一缓存键
          cache-dependency-path: '**/pnpm-lock.yaml'

      # 提高缓存命中率的 pnpm 依赖缓存
      - name: Cache pnpm dependencies 💾
        uses: actions/cache@v3
        id: pnpm-cache
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies 📦
        # 如果缓存未命中才执行完整安装
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install

      # 添加 Next.js 构建缓存
      - name: Cache Next.js build 💾
        uses: actions/cache@v3
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}-
            ${{ runner.os }}-nextjs-

      - name: Build 🔧
        run: pnpm run build

      - name: Add .nojekyll file 📄
        run: touch out/.nojekyll

      - name: Create CNAME file 📝
        run: echo "bayuncao.github.io" > out/CNAME

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # 部署到 gh-pages 分支
          folder: out       # 要部署的文件夹
          clean: true       # 自动删除旧文件